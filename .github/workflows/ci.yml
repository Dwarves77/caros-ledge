name: CI

# The one workflow. CI-TRIM-1: a pull request is the gate (ci, schema and parity run on every pull request, so a pull request must be up to date with main to merge); a push to main runs only changes, migrate, edge-deploy (when edge == 'true') and ruled-runs (when plans != ''); ci-windows is a dispatch (only=windows).
# Job `changes`: which of the expensive jobs a pull request needs (scripts/ci/changes.mjs), and on a push the edge and plans outputs.
# Job `ci`: lint, typecheck, build, tests, tree checks, LOC gates, the connection check, the column check, the migration static checks (npm run gates).
# Job `schema`: supabase/schema.sql applied to an empty Postgres 15, then the migrations (each self-check must print its own OK, each down file is applied and catalog-compared), then the property checks.
# Job `turn`: the turn runtime (scripts/turn.mjs). Dispatch only: it is the one job that holds the service key for a run of the branch it was dispatched on; no pull request or push ever receives it.
# Job `ruled-runs` (RUN-1): a push to main that changed a plan file under scripts/runs/plans/ runs that plan's turn steps in order (scripts/runs/execute.mjs), with the turn job's environment and secrets, after `migrate`. A production run is a plan in a pull request; nobody dispatches it. It is the only job that holds the service key on a push, and only on main: a pull request never reaches it.
# Each step carries ruled_plan "<plan file>#<step>" in its stage input; the ledger (harness_runs) says which steps already have a success apply row, and those are skipped, so a changed plan is safe to re-run. Nothing is committed back to main: the results are the `ruled-run-results` artifact and the job summary.
# Job `windows`: the test step alone on Windows (a dispatch with only=windows; never a pull request or a push).
# Job `parity`: the built app on the runner, the UX smoke, and the capture compared with tests/parity/baseline (a pull request that touches anything the build reads, or a dispatch; never a push to main).
# Jobs `target` and `live` (P2-15; CI-TRIM-2 / ruling 42: browser checks on a deployment status run against production only, a preview deployment skips `live` with a one-line summary because previews sit behind Vercel SSO; the former `preview-parity` job is removed, it was the `parity` job's capture and compare against a preview URL): on the successful `Vercel` commit status posted by the Vercel app (sender vercel[bot], target_url on vercel.com; Vercel posts a commit status and creates no GitHub Deployment, so a deployment event never fires) or a dispatch with only=live. `live` runs the live checks
# (scripts/ci/live-checks.mjs) with the service key, and the admin account on production or a dispatch only, so it checks out MAIN, never the deployed commit: a branch cannot change the script that holds the secrets.
# Jobs `migrate`, `turn` and `ruled-runs` run in the `production` environment (required reviewers, if the repository sets any). No job runs a package install script (npm ci --ignore-scripts); the Supabase CLI of `edge-deploy` is a devDependency at an exact version.
# Job `report`: after the others (needs, if always), downloads the parity and test artifacts and writes the one job summary and the one PR comment with the default branch's scripts; it polls nothing and never fails the run.
# Artifacts live 3 days (retention-days on every upload; 1 day for ci-results, apply-plan, ruled-run-results and the two failure-only parity captures; every upload is continue-on-error: artifact storage is a quota, never a verdict): the report job reads them in the same run and a person looks within hours; admin-console screenshots and next-start.log are not kept for the 90-day default.
# Every action is pinned to a commit SHA (the tag it was taken from is the comment): a moved tag cannot change a gate.
# Exit 2 (a self-skip) is never converted here: a script exits 2 only where the event cannot carry secrets (src/core/harness/exit.ts), so a green job means the check ran.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Dispatch with only=live or only=screens: the deployed URL to check or photograph (a preview, or production)'
        default: ''
      live_phase:
        description: 'Dispatch with only=live: before (the run made before the cutover window) or after'
        default: after
      live_checks:
        description: 'Dispatch with only=live: check names, comma separated (empty runs the default set; invitation-email and provenance-trigger only when named)'
        default: ''
      stage:
        description: 'Turn stage: sweep, sweep-research, change, capture, intake, connect, propagate, briefs, all or ops'
        default: all
      mode:
        description: 'dry or apply (apply is refused while the scrape cadence is off)'
        default: dry
      input:
        description: 'Turn input, a JSON object keyed by stage'
        default: '{}'
      routes:
        description: 'Baseline recapture (job baseline): route names, comma separated, or all'
        default: all
      only:
        description: 'Run one job on a dispatch: baseline (the old-site recapture), turn, live (the live checks and the deployed-preview parity), screens (full-page screenshots of every route at a live_url), migrate (apply the pending migrations to production), edge-deploy (deploy capture-worker), windows (the test step on Windows), or empty for everything but baseline, live, screens, migrate, edge-deploy and windows; migrate applies the pending migrations of the ref the dispatch is on, so the DDL of a slice branch can reach production ahead of its code'
        default: ''
      chain:
        description: 'Run the stage downstream stages too (false runs only the named stage)'
        default: 'true'
      producer_env:
        description: 'Turn job: comma-separated NAME=1 pairs for producer kill switches, this run only (each NAME must end in _ENABLED; anything else fails the run)'
        default: ''
  status:

permissions:
  contents: read

# The event and the run id are in the group: a push to main and a dispatch on main no longer share one pending slot (GitHub keeps one pending run per group, so a pending main push could be dropped).
# Only a pull request cancels its own earlier run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    if: github.event_name != 'status' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      parity: ${{ steps.scope.outputs.parity }}
      edge: ${{ steps.scope.outputs.edge }}
      plans: ${{ steps.scope.outputs.plans }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Which jobs does this change need?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: node scripts/ci/changes.mjs

  ci:
    name: ci
    if: github.event_name != 'status' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - name: Gates (npm run gates -- --profile full; the full matrix is this job and the merge gate, the pre-push hook runs only the fast subset and the changed modules tests)
        shell: bash -eo pipefail {0}
        run: npm run gates -- --profile full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 1
          name: ci-results
          path: test-output.txt
          if-no-files-found: ignore

  schema:
    name: schema
    if: github.event_name != 'status' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15.14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: npm ci --no-audit --ignore-scripts # the source-backfill generator imports the classify rules (zod)
      - name: Derive the apply plan from supabase/migrations (never committed; a problem in the directory fails here)
        run: node scripts/ci/apply-plan.mjs > "$RUNNER_TEMP/apply-plan.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          retention-days: 1
          name: apply-plan
          path: ${{ runner.temp }}/apply-plan.md
      - name: Apply schema.sql to an empty Postgres 15, then the migrations, the down files and the property checks
        run: npm run schema:apply
      # JOIN-1 J1: the text columns of the tables the engine joins, read from information_schema on the database just built, must all be in the pin (scripts/ci/data/joinability.json): a new column is caught the same PR
      - name: Joinability against this database's information_schema (a text column the pin does not list is red)
        run: npm run joinability:schema

  turn:
    name: turn
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.only == '' || github.event.inputs.only == 'turn')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The `production` environment carries the required reviewers: the dispatched ref runs with the service key only after one of them approves the run.
    environment: production
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - name: Playwright Chromium (the headless transport runs on the runner)
        run: npx playwright install --with-deps chromium
      - name: Producer kill switches (this run only)
        env:
          PRODUCER_ENV: ${{ github.event.inputs.producer_env }}
        run: |
          IFS=',' read -r -d '' -a pairs < <(printf %s "$PRODUCER_ENV") || true
          for pair in "${pairs[@]}"; do
            pair="${pair// /}"
            [ -n "$pair" ] || continue
            [[ "$pair" =~ ^[A-Z0-9_]+_ENABLED=1$ ]] || { echo "::error::producer_env: '$pair' is not NAME_ENABLED=1"; exit 1; }
            echo "$pair" >> "$GITHUB_ENV"
          done
      - name: Turn
        env:
          TURN_STAGE: ${{ github.event.inputs.stage }}
          TURN_MODE: ${{ github.event.inputs.mode }}
          TURN_INPUT: ${{ github.event.inputs.input }}
          TURN_NO_CHAIN: ${{ github.event.inputs.chain == 'false' && '1' || '' }}
        run: |
          input="$TURN_INPUT"
          [ -n "$input" ] || input='{}'
          node scripts/turn.mjs --stage "${TURN_STAGE:-all}" --mode "${TURN_MODE:-dry}" --input "$input" ${TURN_NO_CHAIN:+--no-chain}

  ruled-runs:
    name: ruled-runs
    needs: [changes, migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.fork == false && needs.changes.outputs.plans != '' && needs.migrate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same `production` environment and secrets as `turn`. If the environment has required reviewers (a repository setting), the job waits for one and runs nothing meanwhile.
    environment: production
    # CI-TRIM-1: a plan's data must always apply, so this job is in NO signed-in group and its group can never drop it. GitHub keeps one running and one pending job per group and a newer pending job replaces the older one, so a shared or dedicated group could drop a push's plan;
    # the group is therefore per commit (every push has its own, nothing to replace) and never cancels. The ledger (harness_runs) makes two overlapping runs skip the steps already applied. The visibility check is the separate `visible` job.
    concurrency:
      group: ruled-runs-${{ github.sha }}
      cancel-in-progress: false
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - name: Do the pending plans drive a browser? (a capture or sweep stage, or a chained step; scripts/ci/changes.mjs --browser)
        id: browser
        env:
          PLANS: ${{ needs.changes.outputs.plans }}
        run: node scripts/ci/changes.mjs --browser
      - name: Playwright Chromium (the headless transport runs on the runner; only when a plan drives a browser)
        if: ${{ steps.browser.outputs.browser == 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Run the plans in order (stops at the first failed step)
        env:
          PLANS: ${{ needs.changes.outputs.plans }}
        run: node scripts/runs/execute.mjs $PLANS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 1
          name: ruled-run-results
          path: scripts/runs/results
          if-no-files-found: ignore

  # CI-TRIM-1: the signed-in visibility check over the items a ruled run applied (DRAIN-FIX-2 / CI-BROWSER-1 item 5; scripts/runs/visible.mjs, the judgement in scripts/lib/item-on-page.mjs). Its own job so that being superseded in the production signed-in group
  # (one running, one pending) costs a check and never a plan: the plans' data has applied by then, and the report job labels a cancelled `visible` SUPERSEDED. It starts only after `ruled-runs` succeeded, downloads that job's results artifact, and installs Chromium only for itself,
  # only when the newest results file names applied items.
  visible:
    name: visible
    needs: [changes, ruled-runs]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.fork == false && needs.ruled-runs.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      no_artifact: ${{ steps.noartifact.outputs.no_artifact }}
    concurrency:
      group: signed-in-browser-main
      cancel-in-progress: false
    env:
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: results
        continue-on-error: true
        with:
          name: ruled-run-results
          path: scripts/runs/results
      - name: No results artifact (storage quota), log it; this is a skip and never a pass
        id: noartifact
        if: ${{ steps.results.outcome != 'success' }}
        run: |
          echo 'visible: no results artifact (storage)'
          echo 'no_artifact=true' >> "$GITHUB_OUTPUT"
      - name: Did a plan apply items? (the newest results file names them; scripts/ci/changes.mjs --visible)
        id: visible
        run: node scripts/ci/changes.mjs --visible
      - name: Install (only when a plan applied items)
        if: ${{ steps.visible.outputs.visible == 'true' }}
        run: npm ci --no-audit --ignore-scripts
      - name: Playwright Chromium (for this check alone)
        if: ${{ steps.visible.outputs.visible == 'true' }}
        run: npx playwright install --with-deps chromium
      - name: Visibility of the items a ruled run applied (scripts/runs/visible.mjs)
        if: ${{ steps.visible.outputs.visible == 'true' }}
        env:
          RESULTS_FILE: ${{ steps.visible.outputs.file }}
        run: node scripts/runs/visible.mjs "$RESULTS_FILE" --base https://carosledge.com

  windows:
    name: ci-windows
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'windows'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - run: npm test

  parity:
    name: parity
    # CI-TRIM-1: parity gates a pull request (and a dispatch with only empty) and never runs on a push to main, so it waits for neither `migrate` nor `ruled-runs` (a push is where those two run). The signed-in visibility check of the applied items (scripts/runs/visible.mjs) moved into `ruled-runs`.
    needs: changes
    if: ${{ github.event_name != 'status' && github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '') && (github.event_name != 'pull_request' || needs.changes.outputs.parity == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI-BROWSER-1 (replaces the one LIVE-RL-1 group): the shared Postgres rate budget is per user AND deployment host (hostScopedKey in src/core/http/rate-limit.ts), so a group is per target, never one for every deployment. This job runs the built app on the runner (localhost, no service key, so the in-memory window): it targets neither production nor a preview, and its group is its own PR, or the main push line (the newest head is the one checked).
    # GitHub keeps one running and one pending job per group; a newer queued job replaces the pending one, which the report job labels SUPERSEDED (never a pass, never a fail).
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('signed-in-browser-pr-{0}', github.event.pull_request.number) || 'signed-in-browser-main-parity' }}
      cancel-in-progress: false
    # The baseline was captured in this image (old repo parity-baseline.yml), so fonts and hinting render identically and the pixel diff measures the design, not the machine.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    # The member test account and the public anon key only: this job runs the pull request's own code, which must not be able to read the admin account or the service key.
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Trust the workspace for git (the container user does not own the checkout)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - name: Playwright package matching the image (browsers come from the image)
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund --ignore-scripts
      - run: npm run build
      - name: Start the app (UI fixtures on, set only here)
        id: app
        run: |
          UI_FIXTURES=1 npx next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3100/login > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3100/login > /dev/null || { echo 'the app did not answer on :3100 within 40 s'; tail -n 40 next-start.log; exit 1; }
      # Every step below runs whatever the one before it did (the app having started is the only condition), so one run lists every failure and a pull request needs one run, not one per failing smoke.
      - name: UX smoke (four widths, real fonts)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node tests/ux/ux-smoke.mjs --base http://localhost:3100
      - name: Workspace screens (four widths, behaviours, fixture parity for /settings and /profile)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node tests/ux/workspace-smoke.mjs --base http://localhost:3100
      - name: Market screens (four widths, rating on every headline figure, scope, notices, failed parts)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node tests/ux/market-smoke.mjs --base http://localhost:3100
      - name: Admin screens (four widths, every console tab)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node tests/ux/admin-smoke.mjs --base http://localhost:3100
      - name: Regulations screens (four widths, behaviours)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node tests/ux/regulations-smoke.mjs --base http://localhost:3100
      - name: Dashboard, watchlist, search, portfolio and Assistant screens (four widths, behaviours, fixture parity for /watchlist and /search)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node tests/ux/dash-search-smoke.mjs --base http://localhost:3100
      - name: Community screens (two widths, behaviours, failed reads, fixture parity for /community)
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node tests/ux/community-smoke.mjs --base http://localhost:3100
      - name: Capture the routes
        id: capture
        if: ${{ !cancelled() && steps.app.outcome == 'success' }}
        run: node tests/parity/capture.mjs --base http://localhost:3100 --out parity-capture
      - name: Compare with the baseline
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        shell: bash -eo pipefail {0}
        run: node tests/parity/compare.mjs --captured parity-capture | tee parity-report.txt
      - name: Parity report in the job summary
        if: ${{ !cancelled() }}
        run: |
          { echo '### Parity'; echo '```'; cat parity-report.txt 2>/dev/null || echo 'no report'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ failure() }}
        continue-on-error: true
        with:
          retention-days: 1
          name: parity-capture
          path: |
            parity-capture
            parity-diff
            parity-report.txt
            next-start.log

  # P2-15: what runs on a deployed URL. The successful `Vercel` commit status (a status event runs the workflow from the default branch) and a dispatch with only=live both run the live checks (scripts/ci/live-checks.mjs: one live-smoke row per
  # check through recordRun). The live checks hold the service key, the admin account and the mail key, so this job checks out MAIN (the default branch): the deployed commit is only
  # the thing being looked at, the URL, and its sha is passed as data (LIVE_CODE_SHA) to be written on the ledger row.
  # The URL under test, derived once: the preview of the status's branch (https://caros-ledge-git-<branch>-dwarves77s-projects.vercel.app, the branch lower-cased with every character outside [a-z0-9] replaced by "-"), or production (https://carosledge.com)
  # when the status is the default branch's. A dispatch uses its live_url. A status that names no branch cannot be located and fails the run.
  target:
    name: target
    # A commit status can be written by anyone with statuses:write, and its context is free text. The real one is posted by the Vercel app (sender vercel[bot]) and points at the Vercel dashboard; `live` needs this job, so a spoofed status starts none of them.
    if: (github.event_name == 'status' && github.event.sender.login == 'vercel[bot]' && startsWith(github.event.target_url, 'https://vercel.com/') && github.event.context == 'Vercel' && github.event.state == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      url: ${{ steps.url.outputs.url }}
      production: ${{ steps.url.outputs.production }}
      group: ${{ steps.url.outputs.group }}
      preview: ${{ steps.url.outputs.preview }}
    steps:
      - name: Derive the deployed URL
        id: url
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event.branches[0].name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          LIVE_URL: ${{ github.event.inputs.live_url }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "url=$LIVE_URL" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"
            case "$LIVE_URL" in
              *carosledge.com*) echo "group=signed-in-browser-main" >> "$GITHUB_OUTPUT" ;;
              *) echo "group=signed-in-browser-dispatch-$(printf '%s' "$LIVE_URL" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g')" >> "$GITHUB_OUTPUT" ;;
            esac
          elif [ -z "$BRANCH" ]; then
            echo 'the status names no branch, so the deployed URL cannot be derived'
            exit 1
          elif [ "$BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "url=https://carosledge.com" >> "$GITHUB_OUTPUT"
            echo "production=true" >> "$GITHUB_OUTPUT"
            echo "group=signed-in-browser-main" >> "$GITHUB_OUTPUT"
          else
            slug=$(printf '%s' "$BRANCH" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9]/-/g')
            echo "url=https://caros-ledge-git-${slug}-dwarves77s-projects.vercel.app" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "group=signed-in-browser-preview-${slug}" >> "$GITHUB_OUTPUT"
            echo "preview=true" >> "$GITHUB_OUTPUT"
            echo '### preview deployment: browser checks run on production only (ruling 42)' >> "$GITHUB_STEP_SUMMARY"
          fi

  live:
    name: live
    needs: target
    # Ruling 42: a status event for a preview deployment (needs.target.outputs.preview) skips this job; a preview sits behind Vercel SSO protection, so the browser can only reach the sign-in page. Production and a dispatch run it.
    if: ((github.event_name == 'status' && github.event.context == 'Vercel' && github.event.state == 'success') || (github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'live')) && needs.target.outputs.preview != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI-BROWSER-1 (replaces the one LIVE-RL-1 group): the shared Postgres rate budget is per user AND deployment host (hostScopedKey in src/core/http/rate-limit.ts), so a group is per target, never one for every deployment. Production serialises in signed-in-browser-main; a preview has a group of its own branch, so no other PR or main run can cancel it.
    # GitHub keeps one running and one pending job per group; a newer queued job replaces the pending one, which the report job labels SUPERSEDED (never a pass, never a fail).
    concurrency:
      group: ${{ needs.target.outputs.group }}
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      LIVE_BASE_URL: ${{ needs.target.outputs.url }}
      LIVE_CODE_SHA: ${{ github.event.sha || github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
      # The production admin account signs in to production, or to the target a dispatch chose; never to the preview of a branch (that runs the branch's code on the production database). On a preview the names are empty and the check is skipped by name.
      LIVE_ADMIN_PAGES: ${{ (needs.target.outputs.production == 'true' || github.event_name == 'workflow_dispatch') && 'on' || 'off' }}
      LIVE_ADMIN_EMAIL: ${{ (needs.target.outputs.production == 'true' || github.event_name == 'workflow_dispatch') && secrets.LIVE_ADMIN_EMAIL || '' }}
      LIVE_ADMIN_PASSWORD: ${{ (needs.target.outputs.production == 'true' || github.event_name == 'workflow_dispatch') && secrets.LIVE_ADMIN_PASSWORD || '' }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      INVITATION_FROM_EMAIL: ${{ secrets.INVITATION_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - name: Playwright package matching the image (browsers come from the image)
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund --ignore-scripts
      # LIVE-GATE-1: the signed-in DOM gate reads a session minted here, server side: the service role asks Supabase Auth for a magic link for LIVE_ADMIN_EMAIL, the token is exchanged and the cookies saved at scripts/tmp/live-session.json (gitignored). No password is typed. A missing name or a first navigation that still lands on /login is exit 1, so the live job is red and the check below never runs on a stale or absent session.
      - name: Mint the signed-in session (exit 1 if it cannot be minted or lands on /login)
        run: node scripts/ci/live-session.mjs --base "$LIVE_BASE_URL"
      - name: Live checks (a missing secret on a run that can carry it is exit 1 and names the secret; signed-in-dom prints every assertion of tests/live/assertions.json and is red on an armed failure)
        env:
          LIVE_PHASE: ${{ github.event.inputs.live_phase }}
          LIVE_ONLY: ${{ github.event.inputs.live_checks }}
        run: node scripts/ci/live-checks.mjs --base "$LIVE_BASE_URL" --phase "${LIVE_PHASE:-after}" ${LIVE_ONLY:+--only "$LIVE_ONLY"}

  # Recapture of the parity baseline from the old site (tests/parity/baseline/README.md says how to use the artifact). Dispatch only: never on push or pull_request.
  baseline:
    name: baseline
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI-BROWSER-1 (replaces the one LIVE-RL-1 group): the shared Postgres rate budget is per user AND deployment host (hostScopedKey in src/core/http/rate-limit.ts), so a group is per target, never one for every deployment. The old site is the production host.
    # GitHub keeps one running and one pending job per group; a newer queued job replaces the pending one, which the report job labels SUPERSEDED (never a pass, never a fail).
    concurrency:
      group: signed-in-browser-main
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - name: Playwright package matching the image (browsers come from the image)
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund --ignore-scripts
      - name: Capture the old site
        env:
          ROUTES: ${{ inputs.routes || 'all' }}
        run: node tests/parity/capture.mjs --base https://carosledge.com --out parity-baseline --site old --routes "$ROUTES"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 3
          name: parity-baseline-${{ github.run_id }}
          path: parity-baseline

  # P2-15e: full-page PNGs of every route in tests/parity/routes.json (and the first item of each detail route) at 1280x900 and 375x812 against live_url, signed in as the member
  # account (and the admin account when configured), uploaded as one artifact for a person to look at. Dispatch only: never on push or pull_request.
  screens:
    name: screens
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'screens'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI-BROWSER-1 (replaces the one LIVE-RL-1 group): the shared Postgres rate budget is per user AND deployment host (hostScopedKey in src/core/http/rate-limit.ts), so a group is per target, never one for every deployment. A dispatch against production serialises with the production checks; any other URL has its own group.
    # GitHub keeps one running and one pending job per group; a newer queued job replaces the pending one, which the report job labels SUPERSEDED (never a pass, never a fail).
    concurrency:
      group: ${{ contains(github.event.inputs.live_url, 'carosledge.com') && 'signed-in-browser-main' || format('signed-in-browser-dispatch-{0}', github.event.inputs.live_url) }}
      cancel-in-progress: false
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
      LIVE_ADMIN_EMAIL: ${{ secrets.LIVE_ADMIN_EMAIL }}
      LIVE_ADMIN_PASSWORD: ${{ secrets.LIVE_ADMIN_PASSWORD }}
      PARITY_ADMIN: ${{ secrets.LIVE_ADMIN_EMAIL && secrets.LIVE_ADMIN_PASSWORD && '1' || '' }}
      SCREENS_BASE: ${{ github.event.inputs.live_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - name: Playwright package matching the image (browsers come from the image)
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund --ignore-scripts
      - name: Photograph every route (admin routes only when PARITY_ADMIN=1)
        run: node tests/parity/capture.mjs --base "$SCREENS_BASE" --out screens --fresh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          retention-days: 3
          name: screens-${{ github.run_id }}
          path: screens

  # The only way a migration reaches production. The database is the record of what it carries (public.migration_log, migration 0078): the pending files (scripts/ci/apply-plan.mjs order, derived from supabase/migrations on every run and never committed; HOLD rows left out, minus the files the log
  # holds; with no log yet, only 0078) are applied in order with SUPABASE_DB_URL, each file must print its own OK notice, a file's log row is written in its own transaction before its COMMIT, and the first failure stops the run. It commits
  # nothing and writes nothing to the repository. It holds that one secret, runs on a push to main or on a dispatch with only=migrate on ANY ref (standing rule 3: the DDL goes before the code, so a coordinator dispatch on a slice branch applies that branch's pending migrations ahead of its code), never on a pull request, never on a push to a branch and never in a fork, and one run at a time. A dispatch needs write access to the repository; the run's log names the ref.
  migrate:
    name: migrate
    if: github.event.repository.fork == false && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'migrate'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The `production` environment carries the required reviewers: a push to main or a dispatch on any ref reaches the database only after one of them approves the run.
    environment: production
    concurrency:
      group: migrate
      cancel-in-progress: false
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --ignore-scripts
      - name: Pending migrations
        run: node scripts/ci/migrate.mjs --pending
      - name: Apply them in order (stops at the first failure; each file must print its own OK)
        run: node scripts/ci/migrate.mjs --apply
      # JOIN-1 J3 and the key coverage: the one place a pull request's credential-free gate cannot reach. The sample is read-only (BEGIN READ ONLY) with the migration credential this job already holds; no secret is added. Its verdict is in the job summary and the step is
      # red when a finding is not on scripts/ci/joinability-allow.json, but it does not stop the job: ruled-runs and edge-deploy need this job to succeed, and an allow-list entry that a ruled run's fill has just made stale must not block the next push's data runs.
      - name: Joinability sample (units, tokens, severity, detector keys, claims by surface and tier; read-only)
        continue-on-error: true
        run: node --import ./tests/_support/register.mjs scripts/ci/joinability.mjs --sample

  # Deploys the Edge Function the repository carries. Runs on a push to main after `migrate` (the schema is ahead of the code) when the push changed supabase/functions or src/core/fetch (the `changes` job's `edge`; a push that
  # did not has the reason in the `changes` summary), or on a dispatch with only=edge-deploy on main; never on a pull request or in a fork. It holds the one token and checks the deploy by the function list: the version went up and the status is ACTIVE.
  edge-deploy:
    name: edge-deploy
    needs: [changes, migrate]
    if: ${{ !cancelled() && github.event.repository.fork == false && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.migrate.result == 'success' && needs.changes.outputs.edge == 'true') || (github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'edge-deploy')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: edge-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      # The Supabase CLI is a devDependency at an exact version (package.json, package-lock.json with integrity); `npx supabase@2.121.0` finds that installed copy, so what runs with the token is what the lockfile pins. The token is in the deploy step alone, never in the install.
      - run: npm ci --no-audit --ignore-scripts
      - name: Deploy capture-worker, then require a higher version and status ACTIVE
        shell: bash -eo pipefail {0}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "missing (exit 1): SUPABASE_ACCESS_TOKEN. A run that can carry it and does not have it has not run; it is a failure, never a skip" >&2; exit 1; fi
          ref=kwrsbpiseruzbfwjpvsp
          row() { npx --no-install supabase@2.121.0 functions list --project-ref "$ref" -o json | node -e 'const f = JSON.parse(require("fs").readFileSync(0, "utf8")).find((x) => x.slug === "capture-worker"); console.log(f ? `${f.version} ${f.status}` : "0 ABSENT")'; }
          before=$(row)
          npx --no-install supabase@2.121.0 functions deploy capture-worker --project-ref "$ref" --use-api
          after=$(row)
          printf '### edge-deploy\n\ncapture-worker (version status): before %s, after %s\n' "$before" "$after" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${after%% *}" -gt "${before%% *}" ] && [ "${after#* }" = ACTIVE ] || { echo "capture-worker was not deployed: the version did not increase or the status is not ACTIVE" >&2; exit 1; }

  # The one writer of the run's record: runs after every job that can run on a pull request or a push, polls nothing, holds no secrets, and never fails the run itself (it reports the others' conclusions).
  report:
    name: report
    needs: [changes, ci, schema, turn, windows, parity, visible]
    if: always() && github.event_name != 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      # The only job whose token can write to a pull request runs the DEFAULT BRANCH's scripts. The tree under report is checked out beside them as data (pr-tree/: the code-line count reads it, nothing in it is run).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: pr-tree
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: parity-capture
          path: parity-artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: ci-results
          path: results-artifact
      - name: Label visible SKIPPED-NO-ARTIFACT when its results artifact was not stored (not a pass)
        if: ${{ needs.visible.outputs.no_artifact == 'true' }}
        run: |
          echo '### visible: SKIPPED-NO-ARTIFACT (artifact storage); the visibility check did not run' >> "$GITHUB_STEP_SUMMARY"
      - name: Job summary and the PR comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          NEEDS: ${{ toJSON(needs) }}
          LOC_ROOT: pr-tree
        run: node scripts/ci/pr-comment.mjs
