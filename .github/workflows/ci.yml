name: CI

# The one workflow. Job `ci`: lint, typecheck, build, tests, tree checks, LOC gates, the connection check.
# Job `schema`: supabase/schema.sql applied to an empty Postgres 15, then the property checks.
# Job `turn`: the turn runtime (scripts/turn.mjs). It runs a turn only on a dispatch, with the project secrets; any other event, and a dispatch with no secrets locally, self-skips with exit 2 and a notice.
# Job `windows`: the test step alone on Windows, once per wave (push to main and dispatch, never a pull request).
# Job `parity`: the built app on the runner, the UX smoke, and the capture compared with tests/parity/baseline (UI slices).
# Jobs `live` and `preview-parity` (P2-15): on a successful PREVIEW deployment (deployment_status) or a dispatch with only=live: the live checks (scripts/ci/live-checks.mjs) and the parity capture of the deployed URL. Every other job ignores a deployment_status event.
# Job `report`: after the others (needs, if always), downloads the parity and test artifacts and writes the one job summary and the one PR comment; it polls nothing and never fails the run.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      live_url:
        description: 'Dispatch with only=live or only=screens: the deployed URL to check or photograph (a preview, or production)'
        default: ''
      live_phase:
        description: 'Dispatch with only=live: before (the run made before the cutover window) or after'
        default: after
      live_checks:
        description: 'Dispatch with only=live: check names, comma separated (empty runs the default set; invitation-email only when named)'
        default: ''
      stage:
        description: 'Turn stage: sweep, sweep-research, change, capture, intake, connect, propagate, briefs, all or ops'
        default: all
      mode:
        description: 'dry or apply (apply is refused while the scrape cadence is off)'
        default: dry
      input:
        description: 'Turn input, a JSON object keyed by stage'
        default: '{}'
      routes:
        description: 'Baseline recapture (job baseline): route names, comma separated, or all'
        default: all
      only:
        description: 'Run one job on a dispatch: baseline (the old-site recapture), turn, live (the live checks and the deployed-preview parity), screens (full-page screenshots of every route at a live_url), or empty for everything but baseline, live and screens'
        default: ''
      chain:
        description: 'Run the stage downstream stages too (false runs only the named stage)'
        default: 'true'
  deployment_status:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.deployment.id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: ci
    if: github.event_name != 'deployment_status' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - name: Gates (npm run gates, the same list the pre-push hook runs)
        shell: bash -eo pipefail {0}
        run: npm run gates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-results
          path: test-output.txt
          if-no-files-found: ignore

  schema:
    name: schema
    if: github.event_name != 'deployment_status' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15.14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --no-audit # the source-backfill generator imports the classify rules (zod)
      - name: Apply schema.sql to an empty Postgres 15, then run the property checks
        run: npm run schema:apply

  turn:
    name: turn
    if: github.event_name != 'deployment_status' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '' || github.event.inputs.only == 'turn')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install (a dispatch only; any other event self-skips before it needs the sources)
        if: github.event_name == 'workflow_dispatch'
        run: npm ci --no-audit
      - name: Playwright Chromium (the headless transport runs on the runner)
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium
      - name: Turn
        run: |
          set +e
          input="$TURN_INPUT"
          [ -n "$input" ] || input='{}'
          node scripts/turn.mjs --stage "${TURN_STAGE:-all}" --mode "${TURN_MODE:-dry}" --input "$input" ${TURN_NO_CHAIN:+--no-chain}
          code=$?
          if [ "$code" -eq 2 ]; then echo "::notice title=turn::self-skipped (exit 2): see the step output"; exit 0; fi
          exit "$code"
        env:
          TURN_STAGE: ${{ github.event.inputs.stage }}
          TURN_MODE: ${{ github.event.inputs.mode }}
          TURN_INPUT: ${{ github.event.inputs.input }}
          TURN_NO_CHAIN: ${{ github.event.inputs.chain == 'false' && '1' || '' }}

  windows:
    name: ci-windows
    if: github.event_name != 'pull_request' && github.event_name != 'deployment_status' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npm test

  parity:
    name: parity
    if: github.event_name != 'deployment_status' && (github.event_name != 'workflow_dispatch' || github.event.inputs.only == '')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The baseline was captured in this image (old repo parity-baseline.yml), so fonts and hinting render identically and the pixel diff measures the design, not the machine.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder' }}
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
      LIVE_ADMIN_EMAIL: ${{ secrets.LIVE_ADMIN_EMAIL }}
      LIVE_ADMIN_PASSWORD: ${{ secrets.LIVE_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Trust the workspace for git (the container user does not own the checkout)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Does this change touch the UI?
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -Eq '^(src/ui/|src/app/|src/features/[^/]+/ui/|tests/(parity|ux)/|\.github/workflows/ci\.yml)'; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: '24'
          cache: npm
      - if: steps.scope.outputs.run == 'true'
        run: npm ci --no-audit
      - name: Playwright package matching the image (browsers come from the image)
        if: steps.scope.outputs.run == 'true'
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund
      - if: steps.scope.outputs.run == 'true'
        run: npm run build
      - name: Start the app (UI fixtures on, set only here)
        if: steps.scope.outputs.run == 'true'
        run: |
          UI_FIXTURES=1 npx next start -p 3100 > next-start.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3100/login > /dev/null && break; sleep 1; done
      - name: UX smoke (four widths, real fonts)
        if: steps.scope.outputs.run == 'true'
        run: node tests/ux/ux-smoke.mjs --base http://localhost:3100
      - name: Workspace screens (four widths, behaviours, fixture parity for /settings and /profile)
        if: steps.scope.outputs.run == 'true'
        run: node tests/ux/workspace-smoke.mjs --base http://localhost:3100
      - name: Market screens (four widths, rating on every headline figure, scope, notices, failed parts)
        if: steps.scope.outputs.run == 'true'
        run: node tests/ux/market-smoke.mjs --base http://localhost:3100
      - name: Admin screens (four widths, every console tab)
        if: steps.scope.outputs.run == 'true'
        run: node tests/ux/admin-smoke.mjs --base http://localhost:3100
      - name: Regulations screens (four widths, behaviours)
        if: steps.scope.outputs.run == 'true'
        run: node tests/ux/regulations-smoke.mjs --base http://localhost:3100
      - name: Dashboard, watchlist, search, portfolio and Assistant screens (four widths, behaviours, fixture parity for /watchlist and /search)
        if: steps.scope.outputs.run == 'true'
        run: node tests/ux/dash-search-smoke.mjs --base http://localhost:3100
      - name: Community screens (two widths, behaviours, failed reads, fixture parity for /community)
        if: steps.scope.outputs.run == 'true'
        run: node tests/ux/community-smoke.mjs --base http://localhost:3100
      - name: Capture the routes
        if: steps.scope.outputs.run == 'true'
        run: node tests/parity/capture.mjs --base http://localhost:3100 --out parity-capture
      - name: Compare with the baseline
        if: steps.scope.outputs.run == 'true'
        shell: bash -eo pipefail {0}
        run: node tests/parity/compare.mjs --captured parity-capture | tee parity-report.txt
      - name: Parity report in the job summary
        if: always() && steps.scope.outputs.run == 'true'
        run: |
          { echo '### Parity'; echo '```'; cat parity-report.txt 2>/dev/null || echo 'no report'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.run == 'true'
        with:
          name: parity-capture
          path: |
            parity-capture
            parity-diff
            parity-report.txt
            next-start.log

  # P2-15: what runs on a deployed URL. A successful PREVIEW deployment (the deployment_status event Vercel posts to GitHub) and a dispatch with only=live both run the live checks (scripts/ci/live-checks.mjs: one live-smoke row per
  # check through recordRun) and the parity capture of the deployed preview (admin routes too, only when the admin account is configured). A deployment_status run checks out the DEPLOYED commit, not the default branch.
  live:
    name: live
    if: (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview') || (github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      LIVE_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.inputs.live_url }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
      LIVE_ADMIN_EMAIL: ${{ secrets.LIVE_ADMIN_EMAIL }}
      LIVE_ADMIN_PASSWORD: ${{ secrets.LIVE_ADMIN_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      INVITATION_FROM_EMAIL: ${{ secrets.INVITATION_FROM_EMAIL }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - name: Playwright package matching the image (browsers come from the image)
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund
      - name: Live checks (exit 2 is a self-skip without credentials)
        shell: bash {0}
        run: |
          node scripts/ci/live-checks.mjs --base "$LIVE_BASE_URL" --phase "${LIVE_PHASE:-after}" ${LIVE_ONLY:+--only "$LIVE_ONLY"}
          code=$?
          if [ "$code" -eq 2 ]; then echo "::notice title=live::self-skipped (exit 2): see the step output"; exit 0; fi
          exit "$code"
        env:
          LIVE_PHASE: ${{ github.event.inputs.live_phase }}
          LIVE_ONLY: ${{ github.event.inputs.live_checks }}

  preview-parity:
    name: preview-parity
    if: (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Preview') || (github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
      LIVE_ADMIN_EMAIL: ${{ secrets.LIVE_ADMIN_EMAIL }}
      LIVE_ADMIN_PASSWORD: ${{ secrets.LIVE_ADMIN_PASSWORD }}
      PARITY_ADMIN: ${{ secrets.LIVE_ADMIN_EMAIL && secrets.LIVE_ADMIN_PASSWORD && '1' || '' }}
      PARITY_BASE: ${{ github.event.deployment_status.environment_url || github.event.inputs.live_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - name: Playwright package matching the image (browsers come from the image)
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund
      - name: Capture the deployed preview (admin routes only when PARITY_ADMIN=1)
        run: node tests/parity/capture.mjs --base "$PARITY_BASE" --out parity-capture
      - name: Compare with the baseline
        shell: bash -eo pipefail {0}
        run: node tests/parity/compare.mjs --captured parity-capture | tee parity-report.txt
      - name: Parity report in the job summary
        if: always()
        run: |
          { echo '### Parity of the deployed preview'; echo '```'; cat parity-report.txt 2>/dev/null || echo 'no report'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-parity-capture
          path: |
            parity-capture
            parity-diff
            parity-report.txt

  # The one writer of the run's record: runs after the others, polls nothing, holds no secrets, and never fails the run itself (it reports the others' conclusions).
  # Recapture of the parity baseline from the old site (tests/parity/baseline/README.md says how to use the artifact). Dispatch only: never on push or pull_request.
  baseline:
    name: baseline
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - name: Playwright package matching the image (browsers come from the image)
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund
      - name: Capture the old site
        run: node tests/parity/capture.mjs --base https://carosledge.com --out parity-baseline --site old --routes "${{ inputs.routes || 'all' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-baseline-${{ github.run_id }}
          path: parity-baseline

  # P2-15e: full-page PNGs of every route in tests/parity/routes.json (and the first item of each detail route) at 1280x900 and 375x812 against live_url, signed in as the member
  # account (and the admin account when configured), uploaded as one artifact for a person to look at. Dispatch only: never on push or pull_request.
  screens:
    name: screens
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.only == 'screens'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
      LIVE_ADMIN_EMAIL: ${{ secrets.LIVE_ADMIN_EMAIL }}
      LIVE_ADMIN_PASSWORD: ${{ secrets.LIVE_ADMIN_PASSWORD }}
      PARITY_ADMIN: ${{ secrets.LIVE_ADMIN_EMAIL && secrets.LIVE_ADMIN_PASSWORD && '1' || '' }}
      SCREENS_BASE: ${{ github.event.inputs.live_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - name: Playwright package matching the image (browsers come from the image)
        run: npm install --no-save playwright@1.61.1 --no-audit --no-fund
      - name: Photograph every route (admin routes only when PARITY_ADMIN=1)
        run: node tests/parity/capture.mjs --base "$SCREENS_BASE" --out screens --fresh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ github.run_id }}
          path: screens

  report:
    name: report
    needs: [ci, schema, parity]
    if: always() && github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: parity-capture
          path: parity-artifact
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-results
          path: results-artifact
      - name: Job summary and the PR comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/pr-comment.mjs
